<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>melee-01 - Combat Knife Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            overflow: hidden;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        canvas { display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px 25px;
            border-radius: 12px;
            border: 1px solid rgba(100, 200, 255, 0.2);
            pointer-events: auto;
            max-width: 320px;
        }
        
        #info-panel h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #64c8ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        #info-panel .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 15px;
        }
        
        #info-panel .specs {
            font-size: 12px;
            line-height: 1.8;
        }
        
        #info-panel .specs span {
            color: #64c8ff;
        }
        
        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(100, 200, 255, 0.2);
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        
        .btn {
            background: linear-gradient(135deg, #1a3a5c, #0d2340);
            color: #64c8ff;
            border: 1px solid rgba(100, 200, 255, 0.3);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: linear-gradient(135deg, #2a5a8c, #1a4070);
            border-color: #64c8ff;
            transform: translateY(-1px);
        }
        
        .btn.active {
            background: linear-gradient(135deg, #64c8ff, #00ff88);
            color: #000;
            border-color: transparent;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        #loading h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #64c8ff;
        }
        
        #loading p {
            font-size: 14px;
            color: #888;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(100, 200, 255, 0.2);
            border-top-color: #64c8ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #color-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(100, 200, 255, 0.2);
            pointer-events: auto;
        }
        
        #color-panel h3 {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .color-options {
            display: flex;
            gap: 8px;
        }
        
        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .color-btn:hover {
            transform: scale(1.1);
            border-color: #64c8ff;
        }
        
        .color-btn.active {
            border-color: #fff;
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="loading">
            <div class="spinner"></div>
            <h2>Loading Combat Knife</h2>
            <p>Initializing 3D model...</p>
        </div>
    </div>
    
    <div id="ui-overlay">
        <div id="info-panel">
            <h1>🗡️ melee-01</h1>
            <p class="subtitle">Combat Knife - Tactical Series</p>
            <div class="specs">
                <div><span>Type:</span> Clip Point Blade</div>
                <div><span>Blade:</span> 7.5" Serrated Steel</div>
                <div><span>Handle:</span> Cord-Wrapped Grip</div>
                <div><span>Guard:</span> Steel Crossguard</div>
                <div><span>Pommel:</span> Striking Cap</div>
                <div><span>Material:</span> High Carbon Steel</div>
            </div>
        </div>
        
        <div id="color-panel">
            <h3>Blade Finish</h3>
            <div class="color-options">
                <button class="color-btn active" style="background: #4a4a4a;" onclick="changeBladeColor(0x4a4a4a)" title="Stonewash"></button>
                <button class="color-btn" style="background: #1a1a1a;" onclick="changeBladeColor(0x1a1a1a)" title="Black coated"></button>
                <button class="color-btn" style="background: #c0c0c0;" onclick="changeBladeColor(0xc0c0c0)" title="Polished"></button>
                <button class="color-btn" style="background: #2a3a4a;" onclick="changeBladeColor(0x2a3a4a)" title="Blue steel"></button>
            </div>
        </div>
        
        <div id="controls-panel">
            <button class="btn" onclick="resetCamera()">Reset View</button>
            <button class="btn active" id="autoRotateBtn" onclick="toggleAutoRotate()">Auto Rotate</button>
            <button class="btn" id="wireframeBtn" onclick="toggleWireframe()">Wireframe</button>
            <button class="btn" onclick="toggleExplode()">Explode View</button>
            <button class="btn" onclick="resetView()">Front View</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============================================
        // SCENE SETUP
        // ============================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Gradient background
        const canvas = document.createElement('canvas');
        canvas.width = 2;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 512);
        gradient.addColorStop(0, '#0a0a1a');
        gradient.addColorStop(0.5, '#0d1520');
        gradient.addColorStop(1, '#0a0a0f');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 2, 512);
        const bgTexture = new THREE.CanvasTexture(canvas);
        scene.background = bgTexture;

        // Camera
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(1.5, 0.8, 1.5);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.minDistance = 0.5;
        controls.maxDistance = 5;

        // ============================================
        // LIGHTING
        // ============================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        // Main key light
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
        keyLight.position.set(3, 5, 4);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.1;
        keyLight.shadow.camera.far = 20;
        keyLight.shadow.camera.left = -3;
        keyLight.shadow.camera.right = 3;
        keyLight.shadow.camera.top = 3;
        keyLight.shadow.camera.bottom = -3;
        keyLight.shadow.bias = -0.001;
        scene.add(keyLight);

        // Fill light (softer, cooler)
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.4);
        fillLight.position.set(-3, 2, -2);
        scene.add(fillLight);

        // Rim light (for edge definition)
        const rimLight = new THREE.DirectionalLight(0xffffff, 0.8);
        rimLight.position.set(-1, 3, -4);
        scene.add(rimLight);

        // Accent light (warm)
        const accentLight = new THREE.PointLight(0xffaa66, 0.3, 8);
        accentLight.position.set(2, -1, 1);
        scene.add(accentLight);

        // Blue accent
        const blueAccent = new THREE.PointLight(0x4488ff, 0.2, 6);
        blueAccent.position.set(-2, 0, 2);
        scene.add(blueAccent);

        // ============================================
        // GROUND
        // ============================================
        const groundGeometry = new THREE.CircleGeometry(4, 64);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x0a0a10,
            metalness: 0.3,
            roughness: 0.8,
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.15;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid
        const gridHelper = new THREE.GridHelper(6, 30, 0x1a2a3a, 0x0a1520);
        gridHelper.position.y = -0.14;
        scene.add(gridHelper);

        // ============================================
        // COMBAT KNIFE MODEL - HIGH DETAIL
        // ============================================
        function createCombatKnife() {
            const knife = new THREE.Group();
            knife.name = 'combat-knife';

            // Materials
            const bladeMat = new THREE.MeshStandardMaterial({
                color: 0x4a4a4a,
                metalness: 0.85,
                roughness: 0.25,
                envMapIntensity: 1.2,
            });

            const darkSteelMat = new THREE.MeshStandardMaterial({
                color: 0x2d2d2d,
                metalness: 0.7,
                roughness: 0.35,
            });

            const handleMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                metalness: 0.05,
                roughness: 0.85,
            });

            const wrapMat = new THREE.MeshStandardMaterial({
                color: 0x222222,
                metalness: 0.0,
                roughness: 0.95,
            });

            // ---- BLADE ----
            const bladeGroup = new THREE.Group();
            bladeGroup.name = 'blade-assembly';

            // Main blade body
            const bladeShape = new THREE.Shape();
            bladeShape.moveTo(0, 0);
            bladeShape.lineTo(0.018, 0);
            bladeShape.quadraticCurveTo(0.025, 0.3, 0.028, 0.8);
            bladeShape.quadraticCurveTo(0.03, 1.2, 0.025, 1.6);
            bladeShape.quadraticCurveTo(0.02, 1.8, 0.012, 2.0);
            bladeShape.quadraticCurveTo(0.008, 2.1, 0.003, 2.15);
            bladeShape.lineTo(-0.003, 2.15);
            bladeShape.quadraticCurveTo(-0.005, 2.0, -0.008, 1.8);
            bladeShape.quadraticCurveTo(-0.012, 1.4, -0.015, 0.8);
            bladeShape.quadraticCurveTo(-0.018, 0.3, -0.018, 0);
            bladeShape.lineTo(0, 0);

            const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, {
                depth: 0.045,
                bevelEnabled: true,
                bevelThickness: 0.008,
                bevelSize: 0.008,
                bevelSegments: 4,
            });

            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.castShadow = true;
            blade.receiveShadow = true;
            blade.position.set(0, 0, -0.0225);
            blade.rotation.x = Math.PI / 2;
            bladeGroup.add(blade);

            // Blade edge (shiny grind line)
            const edgeShape = new THREE.Shape();
            edgeShape.moveTo(0, 0.1);
            edgeShape.quadraticCurveTo(0.028, 0.5, 0.025, 1.6);
            edgeShape.quadraticCurveTo(0.02, 1.8, 0.012, 2.0);
            edgeShape.lineTo(0.01, 2.0);
            edgeShape.quadraticCurveTo(0.018, 1.8, 0.022, 1.6);
            edgeShape.quadraticCurveTo(0.025, 0.5, 0.02, 0.1);
            edgeShape.lineTo(0, 0.1);

            const edgeGeo = new THREE.ExtrudeGeometry(edgeShape, {
                depth: 0.002,
                bevelEnabled: false,
            });

            const edgeMat = new THREE.MeshStandardMaterial({
                color: 0x8a8a8a,
                metalness: 0.95,
                roughness: 0.1,
            });

            const edge = new THREE.Mesh(edgeGeo, edgeMat);
            edge.position.set(0, 0, -0.0235);
            edge.rotation.x = Math.PI / 2;
            bladeGroup.add(edge);

            // Serrations
            const serrMat = new THREE.MeshStandardMaterial({
                color: 0x3d3d3d,
                metalness: 0.9,
                roughness: 0.2,
            });

            for (let i = 0; i < 8; i++) {
                const toothGeo = new THREE.ConeGeometry(0.007, 0.018, 4);
                const tooth = new THREE.Mesh(toothGeo, serrMat);
                tooth.position.set(-0.016, 0.12 + i * 0.06, 0);
                tooth.rotation.z = Math.PI * 0.6;
                tooth.castShadow = true;
                bladeGroup.add(tooth);
            }

            knife.add(bladeGroup);

            // ---- GUARD ----
            const guardGroup = new THREE.Group();
            guardGroup.name = 'guard-assembly';

            const guardGeo = new THREE.BoxGeometry(0.17, 0.028, 0.075);
            const guard = new THREE.Mesh(guardGeo, darkSteelMat);
            guard.castShadow = true;
            guard.receiveShadow = true;
            guardGroup.add(guard);

            // Quillons
            const quillonGeo = new THREE.CylinderGeometry(0.006, 0.006, 0.03, 8);
            
            const leftQuillon = new THREE.Mesh(quillonGeo, darkSteelMat);
            leftQuillon.position.set(-0.085, 0, 0);
            leftQuillon.rotation.z = Math.PI / 2;
            leftQuillon.castShadow = true;
            guardGroup.add(leftQuillon);

            const rightQuillon = new THREE.Mesh(quillonGeo, darkSteelMat);
            rightQuillon.position.set(0.085, 0, 0);
            rightQuillon.rotation.z = Math.PI / 2;
            rightQuillon.castShadow = true;
            guardGroup.add(rightQuillon);

            knife.add(guardGroup);

            // ---- HANDLE ----
            const handleGroup = new THREE.Group();
            handleGroup.name = 'handle-assembly';

            // Core handle
            const handleGeo = new THREE.CylinderGeometry(0.028, 0.032, 0.38, 12);
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.castShadow = true;
            handle.receiveShadow = true;
            handle.rotation.x = Math.PI / 2;
            handleGroup.add(handle);

            // Wrap rings
            for (let i = 0; i < 10; i++) {
                const ringGeo = new THREE.TorusGeometry(0.03, 0.004, 4, 12);
                const ring = new THREE.Mesh(ringGeo, wrapMat);
                ring.position.set(0, 0, -0.15 + i * 0.035);
                ring.rotation.x = Math.PI / 2;
                ring.castShadow = true;
                handleGroup.add(ring);
            }

            // Diamond pattern wraps
            for (let i = 0; i < 9; i++) {
                const diamondGeo = new THREE.OctahedronGeometry(0.005, 0);
                const diamondL = new THREE.Mesh(diamondGeo, wrapMat);
                diamondL.position.set(0.025, 0, -0.13 + i * 0.035);
                diamondL.rotation.x = Math.PI / 2;
                diamondL.castShadow = true;
                handleGroup.add(diamondL);

                const diamondR = new THREE.Mesh(diamondGeo, wrapMat);
                diamondR.position.set(-0.025, 0, -0.13 + i * 0.035);
                diamondR.rotation.x = Math.PI / 2;
                diamondR.castShadow = true;
                handleGroup.add(diamondR);
            }

            // Finger groove
            const fingerGeo = new THREE.TorusGeometry(0.028, 0.003, 4, 12, Math.PI);
            const finger = new THREE.Mesh(fingerGeo, handleMat);
            finger.position.set(0, -0.02, 0.1);
            finger.rotation.x = Math.PI / 2;
            finger.castShadow = true;
            handleGroup.add(finger);

            knife.add(handleGroup);

            // ---- POMMEL ----
            const pommelGroup = new THREE.Group();
            pommelGroup.name = 'pommel-assembly';

            const pommelGeo = new THREE.CylinderGeometry(0.024, 0.028, 0.045, 6);
            const pommel = new THREE.Mesh(pommelGeo, darkSteelMat);
            pommel.castShadow = true;
            pommel.receiveShadow = true;
            pommel.rotation.x = Math.PI / 2;
            pommelGroup.add(pommel);

            // Strike face
            const strikeGeo = new THREE.CylinderGeometry(0.018, 0.024, 0.012, 6);
            const strikeMat = new THREE.MeshStandardMaterial({
                color: 0x111111,
                metalness: 0.85,
                roughness: 0.25,
            });
            const strike = new THREE.Mesh(strikeGeo, strikeMat);
            strike.position.set(0, 0, 0.028);
            strike.rotation.x = Math.PI / 2;
            strike.castShadow = true;
            pommelGroup.add(strike);

            // Lanyard hole
            const lanyardGeo = new THREE.TorusGeometry(0.007, 0.002, 4, 8);
            const lanyardMat = new THREE.MeshStandardMaterial({
                color: 0x333333,
                metalness: 0.7,
                roughness: 0.4,
            });
            const lanyard = new THREE.Mesh(lanyardGeo, lanyardMat);
            lanyard.position.set(0, 0, 0.025);
            lanyard.rotation.y = Math.PI / 2;
            lanyard.castShadow = true;
            pommelGroup.add(lanyard);

            knife.add(pommelGroup);

            // Store blade reference for color changes
            knife.userData.bladeMesh = blade;
            knife.userData.edgeMesh = edge;

            return knife;
        }

        const knife = createCombatKnife();
        knife.rotation.x = Math.PI / 2;
        knife.rotation.z = Math.PI;
        scene.add(knife);

        // Hide loading
        document.getElementById('loading').style.display = 'none';

        // ============================================
        // ANIMATION
        // ============================================
        let wireframeMode = false;
        let exploded = false;
        const originalPositions = {};

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================
        // CONTROLS
        // ============================================
        window.resetCamera = function() {
            camera.position.set(1.5, 0.8, 1.5);
            controls.target.set(0, 0, 0);
        };

        window.toggleAutoRotate = function() {
            controls.autoRotate = !controls.autoRotate;
            document.getElementById('autoRotateBtn').classList.toggle('active');
        };

        window.toggleWireframe = function() {
            wireframeMode = !wireframeMode;
            knife.traverse((child) => {
                if (child.isMesh) {
                    child.material.wireframe = wireframeMode;
                }
            });
            document.getElementById('wireframeBtn').classList.toggle('active');
        };

        window.toggleExplode = function() {
            exploded = !exploded;
            const offset = exploded ? 0.3 : 0;
            
            knife.children.forEach((child, i) => {
                if (!originalPositions[child.uuid]) {
                    originalPositions[child.uuid] = child.position.clone();
                }
                const orig = originalPositions[child.uuid];
                child.position.z = orig.z + (i - 1.5) * offset;
            });
        };

        window.resetView = function() {
            camera.position.set(0, 0.5, 2.5);
            controls.target.set(0, 0.5, 0);
            controls.autoRotate = false;
            document.getElementById('autoRotateBtn').classList.remove('active');
        };

        window.changeBladeColor = function(color) {
            knife.userData.bladeMesh.material.color.setHex(color);
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.style.background === `rgb(${(color >> 16) & 255}, ${(color >> 8) & 255}, ${color & 255})`) {
                    btn.classList.add('active');
                }
            });
        };

        console.log('🗡️ Combat Knife loaded successfully!');
    </script>
</body>
</html>
