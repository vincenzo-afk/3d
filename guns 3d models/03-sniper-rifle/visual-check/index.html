<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>03 Sniper Rifle Review Harness</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      html, body { margin: 0; min-height: 100%; background: #010207; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #status { position: fixed; left: 14px; bottom: 14px; color: rgba(220,234,255,.9); background: rgba(2,5,12,.78); border: 1px solid rgba(75,132,185,.28); padding: 7px 10px; font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .02em; }
      #snapshot { display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="status">loading sniper-rifle harness</div>
    <img id="snapshot" alt="sniper-rifle snapshot" />
    <script type="module" src="/main.ts"></script>
  </body>
</html>
